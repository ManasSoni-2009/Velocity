# Velocity Multipath Relay — Linux & Oracle Cloud (A1.Flex ARM64) Network Tuning
# Placed at /etc/sysctl.d/99-velocity-sysctl.conf

# Allow IP forwarding & symmetric/asymmetric multipath TUN routing
net.ipv4.ip_forward = 1
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0

# High-capacity UDP socket buffers for bursty dual-link (Wi-Fi + 5G) multipath packets
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304
net.core.netdev_max_backlog = 16384
net.core.optmem_max = 262144

# Modern BBR + Fair Queue pacing for upstream WAN connections leaving tun0
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Larger NAT conntrack table + quicker UDP stale entry cleanup for many concurrent flows
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120
