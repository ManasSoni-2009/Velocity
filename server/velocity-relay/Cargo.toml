[package]
name = "velocity-relay"
version = "0.1.0"
edition = "2021"
authors = ["Velocity Team"]
description = "High-performance multipath bonding relay server for Linux"

[dependencies]
velocity-proto = { path = "../../native/velocity-proto" }
tokio = { version = "1.36", features = ["full"] }
parking_lot = "0.12"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
byteorder = "1.5"
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
rand = "0.8"
thiserror = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
