<svg viewBox="0 0 1200 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Velocity VL01 Multipath Architecture">
  <defs>
    <linearGradient id="frameRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EDFA" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#A473C3" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="1192" height="312" rx="24" fill="#140E20" stroke="#3D2556" stroke-width="1.2" />

  <!-- Left Node: Phone + AndroidNetworkMonitor + velocity-core -->
  <g transform="translate(36, 48)">
    <rect x="0" y="0" width="276" height="224" rx="20" fill="#241738" stroke="#3D2556" stroke-width="1.2" />
    <text x="22" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#A473C3" letter-spacing="1.2">CLIENT · ANDROID</text>
    <text x="22" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#F5EDFA">Velocity App &amp; JNI</text>

    <rect x="20" y="80" width="236" height="40" rx="12" fill="#140E20" stroke="#3D2556" stroke-width="1" />
    <circle cx="38" cy="100" r="4" fill="#34D399" />
    <text x="52" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#F5EDFA">AndroidNetworkMonitor (DNS)</text>

    <rect x="20" y="130" width="236" height="40" rx="12" fill="#140E20" stroke="#3D2556" stroke-width="1" />
    <text x="32" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#F5EDFA">BDP Scheduler + XOR FEC</text>

    <rect x="20" y="180" width="236" height="28" rx="9" fill="#6C3C91" />
    <text x="138" y="198" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#F5EDFA">ChaCha20-Poly1305 AEAD</text>
  </g>

  <!-- Center Upper: Wi-Fi Path 0 -->
  <g transform="translate(395, 58)">
    <rect x="0" y="0" width="215" height="72" rx="16" fill="#241738" stroke="#A473C3" stroke-opacity="0.55" stroke-width="1.2" />
    <circle cx="24" cy="26" r="4.5" fill="#A473C3">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="30" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F5EDFA">Wi-Fi Socket (Path 0)</text>
    <text x="24" y="54" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#F5EDFA" fill-opacity="0.65">Unmetered · Auto-drops if offline</text>
  </g>

  <!-- Center Lower: Cellular Path 1 -->
  <g transform="translate(395, 190)">
    <rect x="0" y="0" width="215" height="72" rx="16" fill="#241738" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.2" />
    <circle cx="24" cy="26" r="4.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.7s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="30" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F5EDFA">5G / LTE (Path 1)</text>
    <text x="24" y="54" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#F5EDFA" fill-opacity="0.65">Instant failover · BDP deficit</text>
  </g>

  <!-- Right Node: Self-Hosted Relay -->
  <g transform="translate(695, 48)">
    <rect x="0" y="0" width="276" height="224" rx="20" fill="#241738" stroke="url(#frameRim)" stroke-width="1.4" />
    <text x="22" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#A473C3" letter-spacing="1.2">YOUR VPS / ORACLE CLOUD</text>
    <text x="22" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#F5EDFA">velocity-relay (Linux)</text>

    <rect x="20" y="80" width="236" height="40" rx="12" fill="#140E20" stroke="#3D2556" stroke-width="1" />
    <text x="32" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#F5EDFA">UDP :51820 · NAT Roaming</text>

    <rect x="20" y="130" width="236" height="40" rx="12" fill="#140E20" stroke="#3D2556" stroke-width="1" />
    <text x="32" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#F5EDFA">Reorder Buffer [15..120ms]</text>

    <rect x="20" y="180" width="236" height="28" rx="9" fill="#3D2556" />
    <text x="138" y="198" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#F5EDFA">tun0 (10.66.0.1/24) + Masquerade</text>
  </g>

  <!-- Final Node: WAN Internet -->
  <g transform="translate(1032, 114)">
    <rect x="0" y="0" width="132" height="92" rx="18" fill="#6C3C91" stroke="#F5EDFA" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="66" y="42" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#F5EDFA">WAN</text>
    <text x="66" y="64" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#F5EDFA" fill-opacity="0.85">Open Internet</text>
  </g>

  <!-- Connecting Lines + Animated Packets -->
  <path d="M 312 135 L 395 94" fill="none" stroke="#A473C3" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M 312 185 L 395 226" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M 610 94 L 695 135" fill="none" stroke="#A473C3" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M 610 226 L 695 185" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="5 5" />
  <path d="M 971 160 L 1032 160" fill="none" stroke="#F5EDFA" stroke-width="2.2" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite" />
  </path>

  <!-- Uplink Packets -->
  <circle r="4.5" fill="#F5EDFA">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 312 135 L 395 94 L 610 94 L 695 135" />
  </circle>
  <circle r="4.5" fill="#34D399">
    <animateMotion dur="2.3s" repeatCount="indefinite" path="M 312 185 L 395 226 L 610 226 L 695 185" />
  </circle>
  <!-- Downlink Packet -->
  <circle r="4" fill="#A473C3">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M 695 135 L 610 94 L 395 94 L 312 135" />
  </circle>
</svg>
