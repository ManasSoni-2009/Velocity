[package]
name = "velocity-core"
version = "0.1.0"
edition = "2021"
authors = ["Velocity Team"]
description = "High-performance multipath bonding engine, adaptive DRR scheduler, reorder ring buffer, and telemetry"

[dependencies]
velocity-proto = { path = "../velocity-proto" }
tokio = { version = "1.36", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
rand = "0.8"
byteorder = "1.5"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.36", features = ["full", "test-util"] }
