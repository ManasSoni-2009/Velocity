name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-relay:
    name: Build Linux Relay Binaries (x86_64 & arm64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build velocity-relay binary
        run: |
          cargo build --release --manifest-path server/Cargo.toml --target ${{ matrix.target }} --bin velocity-relay
          ARCH=$(echo ${{ matrix.target }} | cut -d'-' -f1)
          mkdir -p dist
          cp server/target/${{ matrix.target }}/release/velocity-relay dist/
          tar -czvf "dist/velocity-relay-${{ github.ref_name }}-linux-${ARCH}.tar.gz" -C dist velocity-relay
          rm dist/velocity-relay

      - name: Upload Relay Artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.target }}
          path: dist/*.tar.gz

  build-apps:
    name: Build Android APKs & Desktop Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" || true

      - name: Install Rust toolchain for Android JNI
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android JNI libraries (.so)
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          mkdir -p composeApp/src/androidMain/jniLibs
          cd native
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../composeApp/src/androidMain/jniLibs \
            build --release -p velocity-jni
          cd ..

      - name: Build Android Release APK
        run: |
          chmod +x gradlew || true
          ./gradlew :composeApp:assembleRelease --stacktrace

      - name: Build Desktop UberJar
        run: |
          ./gradlew :composeApp:packageUberJarForCurrentOS --stacktrace
          mkdir -p dist-desktop
          cp composeApp/build/compose/jars/*.jar dist-desktop/velocity-desktop.jar
          zip -j dist-desktop/velocity-desktop-${{ github.ref_name }}.zip dist-desktop/velocity-desktop.jar

      - name: Upload App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps-artifacts
          path: |
            composeApp/build/outputs/apk/release/*.apk
            dist-desktop/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-relay, build-apps]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten release assets & Generate SHA256 checksums
        run: |
          mkdir -p final-assets
          find release-assets -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} final-assets/ \;
          cd final-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
